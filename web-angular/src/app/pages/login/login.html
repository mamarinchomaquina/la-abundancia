<div class="pagina">
  <div class="tarjeta">

    <div class="marca">
      <img src="logo-abundancia.png" alt="La Abundancia" class="login-logo" />
      <span class="nombre">La Abundancia</span>
      <span class="nombre-sub">Comida típica, Postres &amp; Quesos</span>
    </div>

    <h1>Bienvenido</h1>
    <p class="subtitulo">Panel de administración</p>

    <form (ngSubmit)="submit()" #f="ngForm">

      <div class="campo">
        <label for="email">Correo electrónico</label>
        <input
          id="email"
          type="email"
          [(ngModel)]="email"
          name="email"
          placeholder="admin@correo.com"
          autocomplete="email"
        />
      </div>

      <div class="campo">
        <label for="password">Contraseña</label>
        <input
          id="password"
          type="password"
          [(ngModel)]="password"
          name="password"
          placeholder="••••••••"
          autocomplete="current-password"
        />
      </div>

      @if (error()) {
        <p class="mensaje-error">{{ error() }}</p>
      }

      <button type="submit" [disabled]="cargando()">
        {{ cargando() ? 'Ingresando…' : 'Ingresar' }}
      </button>

    </form>
  </div>
</div>
