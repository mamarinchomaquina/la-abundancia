<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-marca">
      <img src="logo-abundancia.png" alt="La Abundancia" class="sidebar-logo" />
      <span class="sidebar-titulo">La Abundancia</span>
      <span class="sidebar-subtitulo">Panel Admin</span>
    </div>

    <nav class="sidebar-nav">
      <a routerLink="/dashboard" routerLinkActive="activo">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
        Dashboard
      </a>
      <a routerLink="/publicaciones" routerLinkActive="activo">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14,2 14,8 20,8"/></svg>
        Publicaciones
      </a>
      <a routerLink="/solicitudes" routerLinkActive="activo">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
        Solicitudes
      </a>
      <a routerLink="/usuarios" routerLinkActive="activo">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></svg>
        Usuarios
      </a>
    </nav>

    <div class="sidebar-pie">
      <div class="usuario-info">
        <div class="avatar">{{ auth.usuario()?.nombre?.charAt(0) | uppercase }}</div>
        <div>
          <div class="usuario-nombre">{{ auth.usuario()?.nombre }}</div>
          <div class="usuario-rol">Administrador</div>
        </div>
      </div>
      <button class="btn-salir" (click)="cerrarSesion()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16,17 21,12 16,7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Cerrar sesión
      </button>
    </div>
  </aside>

  <main class="contenido">
    <header class="cabecera">
      <div>
        <h1>{{ titulo }}</h1>
        @if (subtitulo) { <p>{{ subtitulo }}</p> }
      </div>
      <div class="cabecera-acciones"><ng-content select="[acciones]" /></div>
    </header>
    <ng-content />
  </main>
</div>
